# CI : formatage, build des installateurs (NexTask et NexTask Client), tests E2E (sur l'API intégrée et
# contre le serveur) et tests du serveur Docker à chaque push sur main et sur chaque PR
name: Tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Annule l'exécution précédente si un nouveau push arrive sur la même branche
concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read

jobs:
  # Formatage Prettier
  format:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Install npm 12
        run: npm install -g npm@12.2.0

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Check formatting
        run: npx prettier --check .

  # Construction de l'installateur Windows
  build:
    runs-on: windows-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Install npm 12
        run: npm install -g npm@12.2.0

      - name: Install dependencies
        run: npm ci

      - name: Create .env
        run: cp .env.template .env
        shell: bash

      - name: Generate Prisma client
        run: npx prisma generate

      - name: Build Windows installer
        run: npm run build:win -- --publish never

      # NexTask Client, puis contrôle de son app.asar : ni API, ni base
      - name: Build Windows client installer
        run: npm run build:client:win -- --publish never

      - name: Check client bundle
        run: npm run check:client-bundle

  # Serveur autonome : image Docker construite depuis le dépôt, puis interrogée
  # en boîte noire (tests/server). Runner Linux, où Docker est disponible
  server:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Install npm 12
        run: npm install -g npm@12.2.0

      # Vitest suffit ici : pas besoin du binaire d'Electron
      - name: Install dependencies
        run: npm ci
        env:
          ELECTRON_SKIP_BINARY_DOWNLOAD: 1

      - name: Run server tests
        run: npm run test:server

  # NexTask Client : les specs E2E rejouées contre un conteneur du serveur (image
  # de test), un par worker. Runner Linux, seul à faire tourner des conteneurs
  # Linux ; Electron s'y affiche sous xvfb
  e2e-remote:
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Install npm 12
        run: npm install -g npm@12.2.0

      - name: Install dependencies
        run: npm ci

      - name: Create .env
        run: cp .env.template .env

      - name: Generate Prisma client
        run: npx prisma generate

      - name: Run E2E tests against the server
        run: xvfb-run --auto-servernum npm run test:e2e:remote

      - name: Upload test results
        if: failure() || cancelled()
        uses: actions/upload-artifact@v7
        with:
          name: test-results-remote
          path: test-results/
          retention-days: 7

  e2e:
    # Runner Windows : Electron dispose d'un vrai affichage, pas besoin de xvfb
    runs-on: windows-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      # Aligne npm sur la version déclarée dans packageManager
      - name: Install npm 12
        run: npm install -g npm@12.2.0

      - name: Install dependencies
        run: npm ci

      # Le .env est ignoré par git, on repart du template
      - name: Create .env
        run: cp .env.template .env
        shell: bash

      # Le client Prisma (src/core/prisma/generated) n'est pas versionné
      - name: Generate Prisma client
        run: npx prisma generate

      - name: Typecheck
        run: npm run typecheck

      # Tests unitaires d'abord : rapides, ils échouent avant le lancement de l'app
      - name: Run unit tests
        run: npm run test:unit

      - name: Run E2E tests
        run: npm run test:e2e

      # Traces, captures et vidéos Playwright en cas d'échec, y compris quand le job est annulé
      - name: Upload test results
        if: failure() || cancelled()
        uses: actions/upload-artifact@v7
        with:
          name: test-results
          path: test-results/
          retention-days: 7
