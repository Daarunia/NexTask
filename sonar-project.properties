sonar.projectKey=nextask
sonar.projectName=NexTask
sonar.projectVersion=1.0
sonar.host.url=http://localhost:9000
sonar.sources=src
# Catalogues de traduction : même structure dans chaque langue par nature
sonar.cpd.exclusions=src/renderer/constants/**/*.ts,src/renderer/locales/**/*.ts,src/main/locales/**/*.ts
sonar.coverage.exclusions=**

# Tailwind v4 : @reference est une directive de Tailwind, inconnue de l'analyseur CSS de Sonar
# (faux positif dans les <style> des composants Vue)
sonar.issue.ignore.multicriteria=twReference,ariaBound,ariaNative,ariaRole
sonar.issue.ignore.multicriteria.twReference.ruleKey=css:S4662
sonar.issue.ignore.multicriteria.twReference.resourceKey=**/*.vue

# Combobox ARIA de la recherche (motif WAI-ARIA, <select>/<datalist> ne permettent pas
# des suggestions riches). aria-expanded/aria-selected sont liés en :attr, invisibles pour Sonar.
sonar.issue.ignore.multicriteria.ariaBound.ruleKey=Web:S6807
sonar.issue.ignore.multicriteria.ariaBound.resourceKey=src/renderer/components/BoardSearch.vue
sonar.issue.ignore.multicriteria.ariaNative.ruleKey=Web:S6819
sonar.issue.ignore.multicriteria.ariaNative.resourceKey=src/renderer/components/BoardSearch.vue
sonar.issue.ignore.multicriteria.ariaRole.ruleKey=Web:S6842
sonar.issue.ignore.multicriteria.ariaRole.resourceKey=src/renderer/components/BoardSearch.vue
